[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "affect-av"
version = "0.1.0"
description = "Audio-visual emotion recognition on RAVDESS with face-crop fusion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "opencv-contrib-python>=4.8",
    "imageio-ffmpeg>=0.4.9",
    "mediapipe>=0.10.9",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
wavlm = ["transformers>=4.36"]

[project.scripts]
affect-preprocess = "affect_av.dataset:main"
affect-train = "affect_av.train:main"
affect-eval = "affect_av.evaluate:main"
affect-cv = "affect_av.cross_validate:main"
affect-web = "affect_av.web_app:main"

[tool.setuptools.packages.find]
include = ["affect_av*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
